<div class="break-popover" (click)="$event.stopPropagation()">
    <div class="quick-picks">
        <button (click)="startQuick(5)">5m</button>
        <button (click)="startQuick(10)">10m</button>
        <button (click)="startQuick(15)">15m</button>
    </div>
    <div class="custom-pick">
        <input
            type="number"
            min="1"
            max="180"
            placeholder="Minuti..."
            [(ngModel)]="customMinutes"
            (keydown.enter)="startCustom()"
        />
        <button (click)="startCustom()" [disabled]="!customMinutes()">
            <app-icon name="check" [size]="16" />
        </button>
    </div>
</div>

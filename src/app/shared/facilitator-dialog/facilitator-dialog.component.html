<app-modal [open]="open()" title="Gestione stanza" (closed)="close()">
    <div class="settings-content">

        <div class="settings-row">
            <span class="settings-label">Preset carte</span>
            <select [ngModel]="roomStore.preset()" (ngModelChange)="roomStore.changePreset($event)">
                <option value="fibonacci">Fibonacci</option>
                <option value="tshirt">Taglie (T-shirt)</option>
            </select>
        </div>

        <div class="settings-row">
            <span class="settings-label">Accesso stanza</span>
            <button class="icon-button" (click)="roomStore.setRoomLocked(!roomStore.locked())">
                <app-icon [name]="roomStore.locked() ? 'lock' : 'unlock'" [size]="16" />
            </button>
        </div>

    </div>
</app-modal>
